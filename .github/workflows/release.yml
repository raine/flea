name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: flea

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: flea-darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: flea-darwin-amd64
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: flea-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: flea-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          tar -C "$(dirname "$bin")" -czf ${{ matrix.artifact }}.tar.gz ${BIN_NAME}
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.sha256
      - name: Smoke test packaged binary
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          package_dir="package-${{ matrix.artifact }}"
          mkdir "$package_dir"
          tar -xzf ${{ matrix.artifact }}.tar.gz -C "$package_dir"
          "$package_dir/${BIN_NAME}" --help
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: actions/checkout@v5
        with:
          repository: raine/homebrew-flea
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Generate formula and push to tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA_MAC_ARM=$(awk '{print $1}' flea-darwin-arm64.sha256)
          SHA_MAC_INTEL=$(awk '{print $1}' flea-darwin-amd64.sha256)
          SHA_LINUX_ARM=$(awk '{print $1}' flea-linux-arm64.sha256)
          SHA_LINUX_INTEL=$(awk '{print $1}' flea-linux-amd64.sha256)

          cat > tap/Formula/flea.rb << EOF
          class Flea < Formula
            desc "Deterministic CLI for Tori.fi listing workflows"
            homepage "https://github.com/raine/flea"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/raine/flea/releases/download/v${VERSION}/flea-darwin-arm64.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/raine/flea/releases/download/v${VERSION}/flea-darwin-amd64.tar.gz"
                sha256 "${SHA_MAC_INTEL}"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/raine/flea/releases/download/v${VERSION}/flea-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/raine/flea/releases/download/v${VERSION}/flea-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
            end

            def install
              bin.install "flea"
            end

            test do
              assert_match "Manage Tori.fi listing workflows", shell_output("#{bin}/flea --help")
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/flea.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/flea.rb
          if git diff --cached --quiet; then
            echo "Formula is up to date"
          else
            git commit -m "flea ${VERSION}"
            git pull --rebase
            git push
          fi
