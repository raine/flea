name: Platform tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  auth-callback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Test browser callback integration
        run: cargo nextest run --locked -E 'test(/marketplace::(tori|vinted)::interactive::tests/)'
